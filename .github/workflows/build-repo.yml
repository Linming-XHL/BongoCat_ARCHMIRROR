name: Arch repository

# BongoCat-X is published as a signed pacman repository on Cloudflare Pages: the
# upstream release repackaged as bongocat-x-bin, plus the Live2D Core library as
# live2d-sdk-nonfree. bongocat-x-git builds from upstream source on the user's
# machine and is therefore not built here. The pipeline polls upstream, builds
# only when the version changed, and self heals a deployment that did not make it
# to the edge.

on:
  schedule:
    # Four times a day is enough to notice a release without hammering the API.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish even when the version is already packaged
        type: boolean
        default: false
      tag:
        description: Upstream tag to package instead of the newest release (e.g. v2.2.2)
        type: string
        required: false
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write

concurrency:
  group: arch-repo
  cancel-in-progress: false

# Container jobs run their steps with "sh", which is bash in POSIX mode: the dot
# builtin then searches PATH instead of the working directory (so "source
# PKGBUILD" cannot find the file) and bash extensions such as arrays are off.
# Every step here is bash, so ask for bash explicitly.
defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'TianMengLucky/BongoCat-X' }}
  # The Pages project and the site domain are deployment identity, not package
  # names: renaming either one would orphan a live repository, so both keep the
  # values they were created with and stay overridable here.
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'bongocat-arch' }}
  STORE_TAG: ${{ vars.STORE_TAG || 'arch-repo-store' }}
  KEEP_VERSIONS: ${{ vars.KEEP_VERSIONS || '3' }}
  # The repository is served from the custom domain attached to the Pages
  # project; <project>.pages.dev keeps working as a fallback. This value ends up
  # in the clients' pacman.conf, in setup.sh and on the landing page, so it must
  # be the address clients should use.
  SITE_URL: ${{ vars.SITE_URL || 'https://bongocat.zakofox.cn' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  detect:
    name: Check upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      commit: ${{ steps.detect.outputs.commit }}
      build: ${{ steps.detect.outputs.build }}
      bump: ${{ steps.detect.outputs.bump }}
      deploy: ${{ steps.detect.outputs.deploy }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the newest upstream release
        id: detect
        env:
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          args=(--repo "$UPSTREAM_REPO" \
                --store-repo "$GITHUB_REPOSITORY" \
                --store-tag "$STORE_TAG" \
                --site-url "$SITE_URL")
          [[ $INPUT_FORCE == true ]] && args+=(--force)
          [[ -n ${INPUT_TAG:-} ]] && args+=(--tag "$INPUT_TAG")

          output=$(scripts/detect-upstream.sh "${args[@]}")
          printf '%s\n' "$output" | tee -a "$GITHUB_OUTPUT"

      - name: Explain the decision
        env:
          REASON: ${{ steps.detect.outputs.reason }}
          TAG: ${{ steps.detect.outputs.tag }}
          COMMIT: ${{ steps.detect.outputs.commit }}
          BUILD: ${{ steps.detect.outputs.build }}
          DEPLOY: ${{ steps.detect.outputs.deploy }}
        run: |
          {
            echo "### Upstream check"
            echo
            echo "- upstream tag: \`$TAG\` (commit \`${COMMIT:0:12}\`)"
            echo "- decision: $REASON"
            echo "- build: \`$BUILD\`, deploy: \`$DEPLOY\`"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build and sign
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
    outputs:
      packages: ${{ steps.build.outputs.packages }}
    steps:
      # The image ships a stale keyring and no git, and actions/checkout needs
      # git, so this has to run before the repository is checked out.
      - name: Refresh the container
        run: |
          set -eux
          pacman -Sy --noconfirm --needed --disable-download-timeout archlinux-keyring
          # --overwrite keeps a rolling image from failing on files that moved
          # between packages; nothing in a throwaway container is worth keeping.
          pacman -Su --noconfirm --disable-download-timeout --overwrite='*'
          pacman -S --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v4

      - name: Install each published package's build dependencies
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          # repo.conf names the packages the pipeline builds, so adding a
          # package is a matter of putting its PKGBUILD under packages/ and
          # listing it there; nothing in this step is per-package.
          source ./repo.conf
          install_deps=()
          for pkg in "${PUBLISHED_PACKAGES[@]}"; do
            [[ -f packages/$pkg/PKGBUILD ]] || { echo "::error::$pkg has no PKGBUILD"; exit 1; }
            # The leading ./ matters: without a slash the dot builtin looks the
            # name up in PATH when the shell runs in POSIX mode.
            ( source ./packages/$pkg/PKGBUILD
              install_deps+=("${makedepends[@]}" "${depends[@]}" "${optdepends[@]}") )
          done
          pacman -S --noconfirm --needed --disable-download-timeout \
            "${install_deps[@]}" gnupg curl jq zstd namcap

      # live2d-sdk-nonfree unpacks the Cubism SDK, bongocat-x-bin reuses an
      # upstream release archive. Reusing them keeps every build from
      # downloading the same tens of megabytes again.
      - uses: actions/cache@v4
        with:
          path: |
            packages/*/*.zip
            packages/*/*.tar.gz
          key: bongocat-sources-${{ hashFiles('packages/*/PKGBUILD') }}

      - name: Build and sign the packages
        id: build
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUMP: ${{ needs.detect.outputs.bump }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${GPG_PRIVATE_KEY:?the GPG_PRIVATE_KEY secret is required}"
          source ./repo.conf

          # makepkg refuses to run as root, so the builds run as builder. The
          # signing key travels through a file because su does not forward the
          # step's secrets to the other user.
          id -u builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          printf '%s\n' "$GPG_PRIVATE_KEY" >"$GITHUB_WORKSPACE/.gpg-key.asc"
          printf '%s' "${GPG_PASSPHRASE:-}" >"$GITHUB_WORKSPACE/.gpg-passphrase"
          chmod 600 "$GITHUB_WORKSPACE/.gpg-key.asc" "$GITHUB_WORKSPACE/.gpg-passphrase"
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # Only the package that tracks upstream releases follows the detected
          # version; the SDK package is pinned to its own upstream revision and
          # is rebuilt whenever a release is published at all.
          : >"$GITHUB_WORKSPACE/dist-info"
          for pkg in "${PUBLISHED_PACKAGES[@]}"; do
            args=(--out "$GITHUB_WORKSPACE/dist")
            if [[ $pkg == $PRIMARY_PACKAGE ]]; then
              args=(--version "$VERSION" "${args[@]}")
              [[ $BUMP == true ]] && args+=(--bump-pkgrel)
            else
              args=(--bump-pkgrel "${args[@]}")
            fi

            su builder -c "cd '$GITHUB_WORKSPACE' && HOME=/home/builder \
              scripts/build-package.sh $pkg ${args[*]} \
                --key-file '$GITHUB_WORKSPACE/.gpg-key.asc' \
                --passphrase-file '$GITHUB_WORKSPACE/.gpg-passphrase'"
            cat "$GITHUB_WORKSPACE/dist/build-info.env" >>"$GITHUB_WORKSPACE/dist-info"
          done

          rm -f "$GITHUB_WORKSPACE/.gpg-key.asc" "$GITHUB_WORKSPACE/.gpg-passphrase"
          # Publish every package to the same place, so the names that the
          # downstream steps report are the ones the pipeline actually built.
          packages=$(grep -o '^pkgfile=.*' "$GITHUB_WORKSPACE/dist-info" | cut -d= -f2-)
          {
            echo "packages<<EOF"
            printf '%s\n' "$packages"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - name: Report the packages
        run: |
          set -euo pipefail
          {
            echo "### Packages"
            echo
            echo '```'
            grep -oE '^(pkgname|pkgfile|version|size|sha256)=.*' dist-info
            echo '```'
            echo
            echo "<details><summary>namcap (advisory)</summary>"
            echo
            echo '```'
            namcap dist/*.pkg.tar.zst || true
            echo '```'
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Store the package in the rolling release
        run: |
          set -euo pipefail
          scripts/publish-store.sh \
            --store-repo "$GITHUB_REPOSITORY" \
            --store-tag "$STORE_TAG" \
            --prune "$KEEP_VERSIONS" \
            --dir "$GITHUB_WORKSPACE/dist" \
            dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sig

  publish:
    name: Publish to Cloudflare Pages
    needs: [detect, build]
    # A deployment is also refreshed when the site is behind the store, which is
    # how an interrupted run repairs itself on the next schedule.
    if: >-
      always() && needs.detect.outputs.deploy == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: Refresh the container
        run: |
          set -eux
          pacman -Sy --noconfirm --needed --disable-download-timeout archlinux-keyring
          pacman -Su --noconfirm --disable-download-timeout --overwrite='*'
          pacman -S --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v4

      - name: Install the publishing tools
        run: |
          set -eux
          pacman -S --noconfirm --needed --disable-download-timeout \
            gnupg curl jq zstd libarchive nodejs npm

      - name: Assemble the repository and the site
        id: assemble
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${GPG_PRIVATE_KEY:?the GPG_PRIVATE_KEY secret is required}"
          scripts/assemble-repo.sh \
            --keep "$KEEP_VERSIONS" \
            --site-url "$SITE_URL" \
            --store-repo "$GITHUB_REPOSITORY" \
            --store-tag "$STORE_TAG"

      # Runs the deployment through pacman itself: sync the database, read the
      # metadata and download the package with signature verification.
      - name: Verify the repository as a client would
        run: scripts/verify-repo.sh --dir public

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?the CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?the CLOUDFLARE_ACCOUNT_ID secret is required}"

          if ! output=$(npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
                 --production-branch=main 2>&1); then
            grep -qiE 'already exists|already taken|already have a project' <<<"$output" \
              || { printf '%s\n' "$output"; exit 1; }
          fi

          npx --yes wrangler@4 pages deploy public \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

      # Recorded only after the deployment succeeded, so a failed run is picked
      # up again by the next schedule instead of being skipped as done. This also
      # runs when nothing was built: a recovered deployment still has to leave
      # the PKGBUILD describing what the repository now serves.
      - name: Record the published version
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BUMP: ${{ needs.detect.outputs.bump }}
          BUILD: ${{ needs.detect.outputs.build }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source ./repo.conf

          if [[ $BUILD == true ]]; then
            # Only the package that tracks upstream releases moves with the
            # detected version; the SDK package was bumped by the build itself.
            args=("$PRIMARY_PACKAGE" "$VERSION")
            [[ $BUMP == true ]] && args+=(--bump-pkgrel)
          else
            # Nothing was rebuilt, so the recorded version is already correct.
            echo 'no build ran; the recorded versions are unchanged'
            exit 0
          fi

          # makepkg regenerates .SRCINFO and refuses to run as root, so the bump
          # itself is applied as an unprivileged user while the commit that
          # follows still runs here.
          id -u builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && scripts/set-pkgver.sh ${args[*]}"

          # Every package directory is added, because the build bumped the SDK
          # package's pkgrel too, whether or not this step moved it.
          git add packages
          if git diff --cached --quiet; then
            echo 'the PKGBUILDs already record these versions'
            exit 0
          fi
          git commit -m "chore: package bongocat-x ${args[2]}-$(sed -n 's/^pkgrel=//p' packages/${args[0]}/PKGBUILD) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summarise the deployment
        run: |
          {
            echo "### Deployment"
            echo
            echo "- repository: $SITE_URL"
            echo "- Cloudflare Pages project: \`$PAGES_PROJECT\`"
            echo
            echo "Add it to a machine with:"
            echo
            echo '```'
            echo "curl -fsSL $SITE_URL/setup.sh | sudo bash"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
