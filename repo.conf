# Repository-wide settings that do not belong to any single PKGBUILD.
#
# The repository publishes several packages, so its name is a property of the
# repository itself. scripts/assemble-repo.sh and scripts/verify-repo.sh read
# this file; --repo-name overrides it on the command line.
#
# Shell syntax, because the scripts source it directly to stay dependency free.

# Name of the pacman database: $repo.db.tar.gz, and the [section] clients add to
# /etc/pacman.conf. Renaming it invalidates every client configuration.
REPO_NAME='bongocat-x'
repo_name=$REPO_NAME

# Packages built and published by the pipeline. bongocat-x-git is deliberately
# absent: it compiles upstream source and the Live2D SDK on the user's machine,
# which is what -Syu from this repository is not supposed to do.
PUBLISHED_PACKAGES=('bongocat-x-bin' 'live2d-sdk-nonfree')

# Upstream the -bin package republishes.
UPSTREAM_REPO='TianMengLucky/BongoCat-X'

# The package whose version follows upstream releases. It is the one the
# "already packaged?" comparison runs against, and the version the landing page
# shows as the current one.
PRIMARY_PACKAGE='bongocat-x-bin'